spring:
  application:
    name: inventory-import

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:inventory}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only checks that it matches the entities.
      ddl-auto: validate
    # Boot leaves this on by default, which keeps a database connection open for the whole
    # request. Turned off so a connection is held only for as long as a query needs it.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 1000

  flyway:
    locations: classpath:db/migration

  servlet:
    multipart:
      # Comfortably above a 250,000-row workbook. file-size-threshold of 0 sends the upload
      # straight to a temp file instead of buffering it, so this bounds disk rather than heap.
      max-file-size: 50MB
      max-request-size: 51MB
      file-size-threshold: 0B

app:
  cors:
    # Origins the dashboard is served from: the Angular dev server, and the frontend container.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8081}

server:
  port: 8080
  tomcat:
    # An over-limit upload is refused before it is read, but Tomcat must still read and discard the
    # rest of it, or the browser sees a dropped connection instead of our 400 "file too large"
    # error. The default only discards 2MB, which is less than any over-limit upload.
    max-swallow-size: -1
